[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sie"
version = "0.1.0"
description = "Social Media Intelligence Platform - demo/MVP (Telegram-first, policy-governed)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[project.scripts]
sie = "sie.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs a running PostgreSQL (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
